name: Keep Supabase Alive - Daily Ping + Cleanup Oldest

on:
  schedule:
    - cron: '0 0 * * *'  # 00:00 UTC ~ 07:00 VN
  workflow_dispatch:

jobs:
  ping-and-cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Insert new ping & delete oldest row
        run: |
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "Thời gian mới: $NOW"

          # INSERT mới
          curl -s -o /dev/null \
            -X POST \
            "${{ secrets.SUPABASE_URL }}/rest/v1/keep-alive" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{\"created_at\": \"$NOW\", \"note\": \"ping-daily\"}"

          echo "Đã insert dòng mới"

          # DELETE dòng cũ nhất (id nhỏ nhất)
          # Lấy id nhỏ nhất trước (SELECT min(id)), rồi DELETE theo id đó
          MIN_ID_RESPONSE=$(curl -s \
            "${{ secrets.SUPABASE_URL }}/rest/v1/keep-alive?select=id&order=id.asc&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")

          MIN_ID=$(echo "$MIN_ID_RESPONSE" | jq -r '.[0].id // empty')

          if [ -n "$MIN_ID" ]; then
            echo "Xóa dòng cũ nhất (id: $MIN_ID)"
            DELETE_RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
              -X DELETE \
              "${{ secrets.SUPABASE_URL }}/rest/v1/keep-alive?id=eq.$MIN_ID" \
              -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
              -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")

            echo "DELETE status: $DELETE_RESPONSE"
          else
            echo "Không có dòng nào để xóa"
          fi

          # Optional: Kiểm tra 3 dòng mới nhất (khi chạy thủ công)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            curl -s \
              "${{ secrets.SUPABASE_URL }}/rest/v1/keep-alive?select=id,created_at,note&order=created_at.desc&limit=3" \
              -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
              -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
          fi
