name: Keep Supabase Alive - Daily Ping

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase keep-alive table
        run: |
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "Time: $NOW"

          INSERT_RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            "${{ secrets.SUPABASE_URL }}/rest/v1/keep-alive" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{\"created_at\": \"$NOW\", \"note\": \"ping\"}")

          echo "INSERT: $INSERT_RESPONSE"

          SELECT_RESPONSE=$(curl -s -o response.json -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/keep-alive?select=id,created_at,note&order=created_at.desc&limit=5" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")

          echo "SELECT: $SELECT_RESPONSE"
          echo "Latest rows:"
          cat response.json || echo "No response body"

          if [ "$INSERT_RESPONSE" = "201" ] && [ "$SELECT_RESPONSE" = "200" ]; then
            echo "OK"
          else
            echo "FAILED - INSERT: $INSERT_RESPONSE  SELECT: $SELECT_RESPONSE"
          fi
