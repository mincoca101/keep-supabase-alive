name: Keep Supabase Alive - Daily Ping

on:
  schedule:
    - cron: '0 0 * * *'          # Mỗi ngày lúc 00:00 UTC (~07:00 sáng VN)
  workflow_dispatch:             # Cho phép chạy thủ công để test

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase keep-alive table
        run: |
          # Tạo timestamp ISO 8601 chuẩn (UTC)
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "Current UTC time: $NOW"

          # ────────────────────────────────────────────────
          # INSERT - Thêm một dòng mới
          # ────────────────────────────────────────────────
          echo "Sending INSERT request..."

          INSERT_RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            "${{ secrets.SUPABASE_URL }}/rest/v1/keep-alive" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{\"created_at\": \"$NOW\", \"note\": \"ping from GitHub Actions\"}")

          echo "INSERT HTTP Status: $INSERT_RESPONSE"

          # ────────────────────────────────────────────────
          # SELECT - Lấy 5 dòng gần nhất để kiểm tra
          # ────────────────────────────────────────────────
          echo "Fetching latest rows..."

          SELECT_RESPONSE=$(curl -s -o response.json -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/keep-alive?select=id,created_at,note&order=created_at.desc&limit=5" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")

          echo "SELECT HTTP Status: $SELECT_RESPONSE"
          echo ""
          echo "5 dòng gần nhất trong bảng keep-alive:"
          cat response.json | jq . || cat response.json   # dùng jq nếu có, fallback cat

          # ────────────────────────────────────────────────
          # Kết luận
          # ────────────────────────────────────────────────
          echo ""
          if [ "$INSERT_RESPONSE" = "201" ] && [ "$SELECT_RESPONSE" = "200" ]; then
            echo "✅ Thành công: Insert OK và có thể đọc dữ liệu"
          else
            echo "❌ Có vấn đề:"
            echo "   - INSERT: $INSERT_RESPONSE (nên là 201)"
            echo "   - SELECT: $SELECT_RESPONSE (nên là 200)"
            echo "Kiểm tra:"
            echo "  1. Row Level Security (RLS) có policy cho INSERT với anon?"
            echo "  2. Bảng có cột created_at và note đúng kiểu không?"
            echo "  3. Secret SUPABASE_URL và SUPABASE_ANON_KEY đúng chưa?"
          fi

      # Bước optional: in ra toàn bộ log nếu cần debug sâu
      - name: Show full response body if failed (debug)
        if: failure()
        run: |
          echo "Response body from SELECT (nếu có):"
          cat response.json || echo "Không có file response.json"
