name: Keep Supabase Alive - Daily Ping

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase keep-alive table
        run: |
          # Tạo timestamp chuẩn ISO 8601 UTC
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "Thời gian gửi: $NOW"

          # Body JSON - echo ra để kiểm tra chính xác format
          BODY="{\"created_at\": \"$NOW\", \"note\": \"ping-staging-$(date +%s)\"}"
          echo "Body JSON gửi đi:"
          echo "$BODY"

          # INSERT với return=representation để xem dữ liệu trả về nếu insert thật
          INSERT_RESPONSE=$(curl -s -w "\nHTTP %{http_code}" \
            -X POST \
            "${{ secrets.SUPABASE_URL }}/rest/v1/keep-alive" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            -d "$BODY")

          echo ""
          echo "INSERT full response (bao gồm body nếu thành công):"
          echo "$INSERT_RESPONSE"

          # SELECT 5 dòng mới nhất
          SELECT_RESPONSE=$(curl -s -o response.json -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/keep-alive?select=id,created_at,note&order=created_at.desc&limit=5" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")

          echo ""
          echo "SELECT HTTP: $SELECT_RESPONSE"
          echo "5 dòng gần nhất:"
          cat response.json || echo "(không có dữ liệu hoặc lỗi)"

          # Kết luận nhanh
          echo ""
          if echo "$INSERT_RESPONSE" | grep -q "201"; then
            echo "INSERT trả 201 → nhưng kiểm tra body response có object mới không?"
          else
            echo "INSERT KHÔNG phải 201 → có lỗi khác"
          fi
          echo "Nếu response.json vẫn [] hoặc không có 'ping-staging-...' → vấn đề là RLS hoặc body bị ignore"
